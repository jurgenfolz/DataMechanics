{% load i18n %}{% comment %}The quiet button that saves a chart as an image for Instagram; with timeline=True, the list under the chart as images. Scripts wire it.{% endcomment %}{% if timeline %}<button class="chart-save chart-save--inline" type="button" data-save-timeline title="{% translate "Save the list as images (1080 × 1350, for Instagram)" %}" aria-label="{% translate "Save the list as images" %}">{% else %}<button class="chart-save" type="button" data-save-image title="{% translate "Save as image (1080 × 1350, for Instagram)" %}" aria-label="{% translate "Save the chart as an image" %}">{% endif %}{% include "partials/icon.html" with name="image" size="16" %}</button>
