{% comment %}The page in each language. The header shows these links in its bar, or in the phone menu (base.html).{% endcomment %}{% for language in LANGUAGES_HERE %}<a href="{{ language.url }}" hreflang="{{ language.code }}" lang="{{ language.code }}" aria-label="{{ language.name }}" title="{{ language.name }}" data-language{% if language.current %} aria-current="true"{% endif %}>{{ language.code|upper }}</a>{% endfor %}
