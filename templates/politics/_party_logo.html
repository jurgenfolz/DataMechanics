{% load i18n %}{% comment %}A party's logo, or its initials on its colour when there is no logo. Needs `party` (politics.queries.party_info).{% endcomment %}{% if party.logo %}<img class="party-logo" src="{{ party.logo }}" alt="{{ party.abbreviation }}">{% elif party.abbreviation %}<span class="party-badge" style="--party: {{ party.color }}">{{ party.abbreviation }}</span>{% else %}<span class="party-badge party-badge--none" title="{% translate "No party" %}">–</span>{% endif %}
